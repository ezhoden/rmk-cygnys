# Documentation: https://rmk.rs/docs/configuration/
[keyboard]
name = "Cygnus"                   # A label for your configuration; it does not appear on USB or BLE
vendor_id = 0x4c4b                # USB vendor ID (16-bit hex)
product_id = 0x4643               # USB product ID (16-bit hex)
product_name = "Cygnus"           # (Optional) USB product string and BLE device name, defaults to "RMK Keyboard"
chip = "nrf52840"                 # Target microcontroller
usb_enable = true                 # (Optional) Enable USB functionality. If omitted, RMK uses the board/chip default.

[matrix]
# Row and col pins are mandatory
row_pins = ["P0_22", "P0_24", "P11_00", "P0_11"]
col_pins = ["P0_29", "P0_02", "P1_15", "P1_13", "P1_11"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 4
cols = 5
map = """
(0,0)  (0,1)  (0,2)  (0,3)  (0,4)
(1,0)  (1,1)  (1,2)  (1,3)  (1,4)
(2,0)  (2,1)  (2,2)  (2,3)  (2,4)
(3,0)  (3,1)  (3,2)
"""

[keymap]
# One more layer than is defined below: the keymap references layer 2
# (LT(2, ...), TG(2)), which stays empty until the user fills it in.
layers = 3

[[keymap.layer]] # layer 0
keys = """
A       B           C
Kc1     Kc2         Kc3
LCtrl   MO(1)       LShift
OSL(1)  LT(2, Kc9)  LM(1, LShift | LGui)
"""

[[keymap.layer]] # layer 1
keys = """
_  TT(1)  TG(2)
_  _      _
_  _      _
_  _      _
"""
